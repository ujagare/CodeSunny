<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chatbot Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .chat-box {
        height: 400px;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
      }

      .message {
        margin-bottom: 15px;
        display: flex;
        gap: 10px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .message-content {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 18px;
        word-wrap: break-word;
      }

      .message.user .message-content {
        background: #667eea;
        color: white;
      }

      .message.bot .message-content {
        background: white;
        color: #333;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .input-area {
        padding: 20px;
        background: white;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 10px;
      }

      #messageInput {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }

      #messageInput:focus {
        border-color: #667eea;
      }

      #sendBtn {
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: transform 0.2s;
      }

      #sendBtn:hover {
        transform: scale(1.05);
      }

      #sendBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .typing {
        display: none;
        padding: 12px 16px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        max-width: 70%;
      }

      .typing.show {
        display: block;
      }

      .typing span {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #667eea;
        border-radius: 50%;
        margin: 0 2px;
        animation: bounce 1.4s infinite ease-in-out;
      }

      .typing span:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing span:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      .status {
        text-align: center;
        padding: 10px;
        font-size: 12px;
        color: #666;
        background: #f0f0f0;
      }

      .status.connected {
        background: #d4edda;
        color: #155724;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 Gemini Chatbot Test</h1>
        <p>Powered by Google Gemini AI</p>
      </div>

      <div class="status" id="status">Connecting...</div>

      <div class="chat-box" id="chatBox">
        <div class="message bot">
          <div class="message-content">
            👋 Hello! I'm CodeSunny's AI assistant powered by Gemini. How can I
            help you today?
          </div>
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Type your message..."
          onkeypress="if(event.key==='Enter') sendMessage()"
        />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const BACKEND_URL = "http://localhost:5000/api/mcp/chat";
      let sessionId = "web-session-" + Date.now();

      // Test connection
      async function testConnection() {
        try {
          const response = await fetch("http://localhost:5000/api/mcp/health");
          if (response.ok) {
            document.getElementById("status").textContent =
              "✅ Connected to Backend";
            document.getElementById("status").className = "status connected";
          } else {
            throw new Error("Backend not responding");
          }
        } catch (error) {
          document.getElementById("status").textContent = "❌ Backend Offline";
          document.getElementById("status").className = "status error";
        }
      }

      function addMessage(text, isUser = false) {
        const chatBox = document.getElementById("chatBox");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${isUser ? "user" : "bot"}`;

        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";
        contentDiv.textContent = text;

        messageDiv.appendChild(contentDiv);
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function showTyping() {
        const chatBox = document.getElementById("chatBox");
        const typingDiv = document.createElement("div");
        typingDiv.className = "message bot";
        typingDiv.id = "typing-indicator";
        typingDiv.innerHTML = `
                <div class="typing show">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function hideTyping() {
        const typing = document.getElementById("typing-indicator");
        if (typing) typing.remove();
      }

      async function sendMessage() {
        const input = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const message = input.value.trim();

        if (!message) return;

        // Add user message
        addMessage(message, true);
        input.value = "";
        sendBtn.disabled = true;

        // Show typing indicator
        showTyping();

        try {
          const response = await fetch(BACKEND_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: message,
              session_id: sessionId,
            }),
          });

          hideTyping();

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          if (data.error) {
            addMessage("❌ Error: " + data.error);
          } else {
            addMessage(data.reply || "No response");
            if (data.session_id) {
              sessionId = data.session_id;
            }
          }
        } catch (error) {
          hideTyping();
          addMessage("❌ Connection error: " + error.message);
          console.error("Error:", error);
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      // Test connection on load
      testConnection();

      // Focus input
      document.getElementById("messageInput").focus();
    </script>
  </body>
</html>
