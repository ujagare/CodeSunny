<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact CodeSunny</title>
    <meta
      name="description"
      content="Contact CodeSunny for web development, e-commerce, SEO, UI/UX and AI solutions."
    />
    <style>
      :root {
        --bg: #04050a;
        --card: rgba(255, 255, 255, 0.04);
        --line: rgba(255, 255, 255, 0.14);
        --text: #eef2ff;
        --muted: #a9b1cf;
        --accent: #3ee8d5;
        --accent-ink: #041312;
        --ok: #34d399;
        --err: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: radial-gradient(circle at 15% 10%, #14324d 0, transparent 36%),
          radial-gradient(circle at 90% 35%, #26326a 0, transparent 38%), var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 16px 48px;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.3);
        border-radius: 16px;
        padding: 12px 16px;
        backdrop-filter: blur(8px);
      }

      .nav a {
        color: var(--muted);
        text-decoration: none;
        font-weight: 600;
      }

      .nav a:hover {
        color: var(--text);
      }

      .hero {
        margin: 42px 0 26px;
        text-align: center;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2rem, 4.8vw, 3.6rem);
        line-height: 1.08;
      }

      .hero p {
        color: var(--muted);
        max-width: 680px;
        margin: 14px auto 0;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 18px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        padding: 20px;
        backdrop-filter: blur(8px);
      }

      .contact-list {
        margin: 14px 0 0;
        display: grid;
        gap: 10px;
      }

      .contact-list a,
      .contact-list p {
        margin: 0;
        color: var(--muted);
        text-decoration: none;
      }

      .contact-list a:hover {
        color: var(--accent);
      }

      form {
        display: grid;
        gap: 12px;
      }

      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      input,
      select,
      textarea,
      button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      input::placeholder,
      textarea::placeholder {
        color: #90a0c4;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(62, 232, 213, 0.5);
        box-shadow: 0 0 0 3px rgba(62, 232, 213, 0.12);
      }

      button {
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .status {
        display: none;
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
      }

      .status.ok {
        display: block;
        color: #dcfce7;
        border: 1px solid rgba(52, 211, 153, 0.35);
        background: rgba(52, 211, 153, 0.13);
      }

      .status.err {
        display: block;
        color: #fee2e2;
        border: 1px solid rgba(248, 113, 113, 0.35);
        background: rgba(248, 113, 113, 0.13);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <nav class="nav">
        <a href="/">CodeSunny</a>
        <a href="/contact">Open React Contact Page</a>
      </nav>

      <section class="hero">
        <h1>Let’s plan your next website project</h1>
        <p>
          Send your requirement. We will reply with scope, budget range, and
          timeline.
        </p>
      </section>

      <section class="grid">
        <article class="card">
          <h2>Contact Info</h2>
          <div class="contact-list">
            <a href="tel:+918975807578">+91 89758 07578</a>
            <a href="mailto:information@codesunny.in">information@codesunny.in</a>
            <p>Pune, Maharashtra, India</p>
          </div>
        </article>

        <article class="card">
          <h2 style="margin-top: 0">Project Brief</h2>
          <form id="contactForm">
            <div class="two">
              <input name="name" required placeholder="Your Name *" />
              <input type="email" name="email" required placeholder="Email *" />
            </div>
            <div class="two">
              <input name="phone" placeholder="Phone Number" />
              <input name="company" placeholder="Company Name" />
            </div>
            <select name="service" required>
              <option value="">Service Required *</option>
              <option value="web-development">Website Development</option>
              <option value="ecommerce">E-commerce Website</option>
              <option value="ui-ux-design">UI/UX Design</option>
              <option value="seo-optimization">SEO Optimization</option>
              <option value="digital-marketing">Digital Marketing</option>
              <option value="ai-solutions">AI Solutions</option>
            </select>
            <textarea
              name="message"
              required
              placeholder="Project Details *"
            ></textarea>
            <button id="submitBtn" type="submit">Send Project Brief</button>
            <div id="status" class="status"></div>
          </form>
        </article>
      </section>
    </div>

    <script>
      const form = document.getElementById("contactForm");
      const statusBox = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusBox.className = "status";
        statusBox.textContent = "";
        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        const data = Object.fromEntries(new FormData(form).entries());
        const leadMessage = [
          data.message ? `Project details: ${data.message}` : "",
          data.phone ? `Phone: ${data.phone}` : "",
          data.company ? `Company: ${data.company}` : "",
          data.service ? `Service: ${data.service}` : "",
        ]
          .filter(Boolean)
          .join("\n");

        try {
          const response = await fetch("/api/mcp/lead", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: data.name,
              email: data.email,
              message: leadMessage,
            }),
          });

          if (!response.ok) {
            throw new Error("Lead submit failed");
          }

          form.reset();
          statusBox.className = "status ok";
          statusBox.textContent =
            "Message sent successfully. We will contact you within 24 hours.";
        } catch (error) {
          statusBox.className = "status err";
          statusBox.textContent =
            "Failed to send message. Please email information@codesunny.in";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Project Brief";
        }
      });
    </script>
  </body>
</html>
